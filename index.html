/* Layout: phone-first travel log — day tabs on top, one card per stop with Amap actions */

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --route:#ff6a55; --tag:#f0c844; --tag-ink:#1a1506; --amap:#5a9bff; --ok:#5cc28c; --land:#1a211e; --water:#1f4459; --water-edge:#2a5873; --park:#203325; --road:#3d4743; --road-case:#232b28; --metro:#4b8a6e; --county:#323c37; --sc:#1d2421; --cq:#18201c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --card:#1a2220; --ink:#e5ece9; --muted:#97a6a1; --line:#2c3633;
  --route:#ff6a55; --tag:#f0c844; --tag-ink:#1a1506; --amap:#5a9bff; --ok:#5cc28c; --land:#1a211e; --water:#1f4459; --water-edge:#2a5873; --park:#203325; --road:#3d4743; --road-case:#232b28; --metro:#4b8a6e; --county:#323c37; --sc:#1d2421; --cq:#18201c; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.02em}
.brand h1 span{background:var(--tag);color:var(--tag-ink);padding:0 6px;border-radius:2px}
.brand small{color:var(--muted);font-family:var(--mono);font-size:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 11px;font:inherit;font-size:13px;line-height:1.25;text-align:left;cursor:pointer}
.tab b{display:block;font-family:var(--mono);font-size:13px}
.tab span{color:var(--muted);font-size:12px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] span{color:var(--bg);opacity:.75}
.tab .today{display:inline-block;margin-left:4px;font-size:10px;background:var(--route);color:#fff;border-radius:6px;padding:0 4px;vertical-align:1px}
main{padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 40px);max-width:640px;margin:0 auto}
.dayhead h2{margin:4px 0 2px;font-size:21px;font-weight:900;text-wrap:balance}
.dayhead .meta{color:var(--muted);font-size:13px;font-family:var(--mono)}
.dayhead p{margin:8px 0 14px;color:var(--muted);font-size:14.5px}
ol.list{list-style:none;margin:0;padding:0;display:grid}
.stop{display:grid;grid-template-columns:30px minmax(0,1fr) auto;column-gap:12px;row-gap:8px;align-items:start;padding:10px 8px;margin:0 -8px;border-radius:12px;transition:background .2s}
.stop.flash,.stop:focus-within{background:var(--card)}
.stop.flash{box-shadow:0 0 0 2px var(--tag)}
.stop.done .title,.stop.done .acts{opacity:.45}
.num{width:28px;height:28px;border-radius:50%;background:var(--route);color:#fff;font:700 14px/28px var(--mono);text-align:center;border:0;padding:0;cursor:pointer;position:relative}
.num.h{background:var(--ink);color:var(--bg);border-radius:6px;font-family:var(--font);font-size:13px;cursor:default}
.num.f{background:var(--amap);border-radius:6px;font-family:var(--font);font-size:13px;cursor:default}
.stop.done .num:not(.h):not(.f){background:var(--ok)}
.stop.done .num:not(.h):not(.f)::after{content:"✓";position:absolute;inset:0;background:var(--ok);border-radius:50%;font-family:var(--font)}
.title{min-width:0;padding-top:1px}
.title .t{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.title h3{margin:1px 0 0;font-size:17px;line-height:1.3;font-weight:800}
.title p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.title .addr{font-size:12.5px;margin-top:3px;color:var(--muted)}
.acts{display:flex;flex-direction:column;align-items:stretch;gap:5px;padding-top:2px;width:96px}
.act{display:inline-flex;align-items:center;justify-content:center;gap:3px;min-height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap;cursor:pointer;line-height:1}
.act.main{background:var(--amap);border-color:var(--amap);color:#fff}
.act[aria-expanded="true"]{border-color:var(--ink)}
.act:active{transform:scale(.97)}
.act:focus-visible,.tab:focus-visible,.num:focus-visible,.chip:focus-visible{outline:2px solid var(--amap);outline-offset:2px}
.near{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:6px}
.near[hidden]{display:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 11px;font-size:13px;text-decoration:none;font-family:inherit;cursor:pointer}
.leg{display:flex;align-items:center;gap:10px;padding:0 0 0 13px;color:var(--route);font-size:13.5px;font-weight:600;min-height:30px}
.leg::before{content:"";width:0;height:24px;border-left:2.5px solid var(--route)}
.leg.walk::before{border-left-style:dashed}
.info{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--muted)}
.info h4{margin:0 0 6px;color:var(--ink);font-size:14px}
.info ul{margin:0;padding-left:18px}
.mapwrap{margin:0 0 6px;border:1px solid var(--line);border-radius:14px;overflow:auto;background:var(--land);-webkit-overflow-scrolling:touch;max-height:78vh}
.mapwrap svg{display:block;width:100%;height:auto}
.mapwrap.zoom svg{width:200%}
.maphint{font-size:12px;color:var(--muted);margin:0 0 14px;display:flex;justify-content:space-between;gap:8px}
.maphint button{border:0;background:none;color:var(--amap);font:inherit;font-size:12.5px;font-weight:600;padding:0;cursor:pointer}
.r-river{fill:none;stroke:var(--water);stroke-linecap:round;stroke-linejoin:round}
.r-riveredge{fill:none;stroke:var(--water-edge);stroke-linecap:round;stroke-linejoin:round}
.r-rivername{fill:var(--muted);font:600 17px var(--body);letter-spacing:.3em;opacity:.85}
.r-land{fill:var(--land)} .r-park{fill:var(--park)}
.r-parktx{fill:var(--metro);font:600 15px var(--body);text-anchor:middle}
.r-roadcase{fill:none;stroke:var(--road-case);stroke-linejoin:round} .r-road{fill:none;stroke:var(--road);stroke-linejoin:round}
.r-roadtx{fill:var(--muted);font:700 15px var(--body);paint-order:stroke;stroke:var(--road);stroke-width:4px}
.r-metro{fill:none;stroke:var(--metro);stroke-width:4;stroke-linejoin:round;opacity:.85}
.r-metrost{fill:var(--paper);stroke:var(--metro);stroke-width:2.5}
.r-metrotx{fill:var(--metro);font:700 15px var(--body);paint-order:stroke;stroke:var(--land);stroke-width:4px}
.r-bridge{stroke:var(--road-case);stroke-width:5;stroke-linecap:round}
.r-district{fill:var(--muted);font:700 20px var(--body);letter-spacing:.35em;opacity:.45;text-anchor:middle}
.r-county{stroke:var(--county);stroke-width:1.2;stroke-linejoin:round} .r-county.cq{fill:var(--cq)} .r-county.sc{fill:var(--sc)}
.r-provtx{fill:var(--muted);font:900 28px var(--body);letter-spacing:.5em;opacity:.35;text-anchor:middle}
.r-leg{fill:none;stroke:var(--route);stroke-linecap:round} .r-leg.walk{stroke-dasharray:9 7}
.r-rail-in{fill:none;stroke:var(--paper);stroke-width:1.8;stroke-dasharray:7 7}
.r-head{fill:var(--route)}
.r-leglabel{fill:var(--ink);font:700 18px var(--body);paint-order:stroke;stroke:var(--land);stroke-width:5px;stroke-linejoin:round}
.r-pin{fill:var(--route);stroke:var(--paper);stroke-width:3}
.r-pinnum{fill:#fff;font:700 16px var(--mono);text-anchor:middle;dominant-baseline:central}
.r-hotel{fill:var(--ink);stroke:var(--paper);stroke-width:2.5}
.r-hoteltx{fill:var(--paper);font:700 15px var(--body);text-anchor:middle;dominant-baseline:central}
.r-city{fill:var(--paper);stroke:var(--ink);stroke-width:3.5}
.r-tag{fill:var(--tag)} .r-tagtx{fill:var(--tag-ink);font:700 22px var(--body);dominant-baseline:central}
.r-tag.hotel{fill:var(--ink)} .r-tagtx.hotel{fill:var(--paper)}
.r-scale{stroke:var(--ink);stroke-width:2.5;fill:none}
.r-scaletx{fill:var(--muted);font:700 15px var(--mono)} .r-n{fill:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

const NEAR=["美食","咖啡","便利店","廁所","地鐵站","藥店","ATM"];

// ---- 高德連結 ----
// callnative=1：手機有裝高德 App 就直接開 App，沒有就開網頁版
const amapSearch=(kw,c)=>`https://uri.amap.com/search?keyword=${encodeURIComponent(kw)}${c?`&city=${encodeURIComponent(c)}`:""}&src=yurongxing&callnative=1`;
const amapNear=(kw,ll)=>`https://uri.amap.com/search?keyword=${encodeURIComponent(kw)}&center=${ll[0]},${ll[1]}&radius=1000&src=yurongxing&callnative=1`;
const amapNav=(it)=>`https://uri.amap.com/navigation?to=${it.ll[0]},${it.ll[1]},${encodeURIComponent(it.kw)}&mode=car&src=yurongxing&callnative=1`;

// ---- 狀態（打勾）----
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done=store.get("done")||{};
const todayISO=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai"}).format(new Date());
let cur=Math.max(0,DAYS.findIndex(x=>x.d===todayISO));
const hashIdx=DAYS.findIndex(x=>"d"+x.d.replace(/-/g,"")===location.hash.slice(1));
if(hashIdx>=0)cur=hashIdx; else { const s=store.get("tab"); if(DAYS.findIndex(x=>x.d===todayISO)<0 && Number.isInteger(s)) cur=s; }

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),1800)}

function renderTabs(){
  const nav=document.getElementById("tabs");
  nav.innerHTML=DAYS.map((x,i)=>`<button class="tab" role="tab" id="tab${i}" aria-selected="${i===cur}" data-i="${i}"><b>${x.tab}${x.d===todayISO?'<i class="today">今天</i>':""}</b><span>${esc(x.city)}</span></button>`).join("");
  nav.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;store.set("tab",cur);render();window.scrollTo({top:0})});
  const sel=nav.querySelector('[aria-selected="true"]');if(sel)sel.scrollIntoView({inline:"center",block:"nearest"});
}

function stopCard(it,dayKey,idx){
  const key=dayKey+":"+idx, isDone=!!done[key];
  const sid=it.n?` id="stop-${it.n}"`:"";
  const badge=it.h?'<div class="num h" aria-hidden="true">宿</div>':it.f?'<div class="num f" aria-hidden="true">✈</div>':`<button type="button" class="num" data-done aria-pressed="${isDone}" aria-label="第 ${it.n} 站，點一下標記已去過">${it.n}</button>`;
  const addr=it.addr?`<div class="addr">${esc(it.addr)}</div>`:"";
  return `<li class="stop${isDone?" done":""}"${sid} data-key="${key}">
    ${badge}
    <div class="title"><div class="t">${esc(it.t||"")}</div><h3>${esc(it.name)}</h3>${it.d?`<p>${esc(it.d)}</p>`:""}${addr}</div>
    <div class="acts">
      <a class="act main" href="${amapSearch(it.kw,it.c)}" target="_blank" rel="noopener">高德叫車 ↗</a>
      <a class="act" href="${amapNav(it)}" target="_blank" rel="noopener">路線 ↗</a>
      <button class="act" type="button" data-near aria-expanded="false">周邊</button>
    </div>
    <div class="near" hidden>
      ${NEAR.map(k=>`<a class="chip" href="${amapNear(k,it.ll)}" target="_blank" rel="noopener">${k}</a>`).join("")}
      <button class="chip" type="button" data-copy="${esc(it.addr||it.kw)}">複製店名／地址</button>
    </div>
  </li>`;
}

function render(){
  renderTabs();
  const day=DAYS[cur], main=document.getElementById("main");
  history.replaceState(null,"","#d"+day.d.replace(/-/g,""));
  main.innerHTML=`<div class="dayhead"><div class="meta">${esc(day.meta)}</div><h2>${esc(day.title)}</h2><p>${esc(day.note)}</p></div>
  <div class="mapwrap" id="map"></div>
  <div class="maphint"><span>點地圖號碼跳到行程・點清單號碼標記已去過</span><button type="button" id="zoom" aria-pressed="false">放大地圖</button></div>
  <ol class="list">${day.items.map((it,i)=>it.leg?`<li class="leg${it.walk?" walk":""}">${esc(it.leg)}</li>`:stopCard(it,day.d,i)).join("")}</ol>
  <div class="info"><h4>怎麼用高德叫車</h4><ul>
    <li>按「高德叫車」會打開高德並搜尋這個地點，點選正確的結果後按「打車」，就會以它為目的地叫車。</li>
    <li>「路線」直接規劃開車路線；座標是概略的，要精準就用「高德叫車」。</li>
    <li>「周邊」可以找附近的美食、咖啡、廁所、地鐵站。</li>
    <li>叫車前先在高德綁好支付寶或微信支付。</li>
  </ul></div>`;
  try{
    const md=MAPDAYS.find(m=>m.id==="d"+cur), box=document.getElementById("map");
    box.appendChild(drawMap(md,n=>{const li=document.getElementById("stop-"+n);if(!li)return;
      li.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});
      li.classList.add("flash");setTimeout(()=>li.classList.remove("flash"),1400)}));
    const zb=document.getElementById("zoom");
    zb.onclick=()=>{const z=box.classList.toggle("zoom");zb.textContent=z?"縮小地圖":"放大地圖";zb.setAttribute("aria-pressed",String(z))};
  }catch(e){const m=document.getElementById("map");if(m)m.hidden=true}
  main.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{const li=b.closest(".stop"),k=li.dataset.key,on=!done[k];if(on)done[k]=1;else delete done[k];store.set("done",done);li.classList.toggle("done",on);b.setAttribute("aria-pressed",String(on));toast(on?"已標記去過":"已取消標記")});
  main.querySelectorAll("[data-near]").forEach(b=>b.onclick=()=>{const n=b.closest(".stop").querySelector(".near");n.hidden=!n.hidden;b.setAttribute("aria-expanded",String(!n.hidden))});
  main.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{const v=b.dataset.copy;
    const fallback=()=>{const r=document.createRange();r.selectNodeContents(b);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("已選取，長按複製")};
    try{navigator.clipboard.writeText(v).then(()=>toast("已複製："+v),fallback)}catch(e){fallback()}});
}
// render() 在地圖腳本載入後執行

// 離線快取（部署到 GitHub Pages 後生效；在預覽環境會自動略過）
if("serviceWorker" in navigator && location.protocol==="https:" && !/claude/.test(location.hostname)){
  try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
}
</script>
<script>render();</script>
