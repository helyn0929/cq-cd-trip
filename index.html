.num{width:28px;height:28px;border-radius:50%;background:var(--route);color:#fff;font:700 14px/28px var(--mono);text-align:center;border:0;padding:0;cursor:pointer;position:relative}

.stop.done .num:not(.h):not(.f){background:var(--ok)}

.title{min-width:0;padding-top:1px}

.acts{flex:none;display:flex;gap:5px}

const NEAR=["美食","咖啡","便利店","廁所","地鐵站","藥店","ATM"];

// ---- 高德連結 ----
// callnative=1：手機有裝高德 App 就直接開 App，沒有就開網頁版
const amapSearch=(kw,c)=>`https://uri.amap.com/search?keyword=${encodeURIComponent(kw)}${c?`&city=${encodeURIComponent(c)}`:""}&src=yurongxing&callnative=1`;
const amapNear=(kw,ll)=>`https://uri.amap.com/search?keyword=${encodeURIComponent(kw)}&center=${ll[0]},${ll[1]}&radius=1000&src=yurongxing&callnative=1`;
const amapNav=(it)=>`https://uri.amap.com/navigation?to=${it.ll[0]},${it.ll[1]},${encodeURIComponent(it.kw)}&mode=car&src=yurongxing&callnative=1`;
// 直接開高德 App（iOS: iosamap://，Android: androidamap:// / amapuri://），沒裝 App 才退回網頁版
const UA=navigator.userAgent, IS_IOS=/iPhone|iPad|iPod/.test(UA)||(/Macintosh/.test(UA)&&"ontouchend" in document), IS_AND=/Android/.test(UA);
function amapApp(kind,kw,ll,name,web){
  const e=encodeURIComponent, sa="sourceApplication=yurongxing";
  if(IS_IOS){
    if(kind==="nav")return `iosamap://path?${sa}&dlat=${ll[1]}&dlon=${ll[0]}&dname=${e(name||kw)}&dev=1&t=0`;
    if(kind==="near")return `iosamap://poi?${sa}&name=${e(kw)}&lat1=${ll[1]-.01}&lon1=${ll[0]-.01}&lat2=${ll[1]+.01}&lon2=${ll[0]+.01}&dev=1`;
    return `iosamap://poi?${sa}&name=${e(kw)}&dev=0`;
  }
  if(IS_AND){
    // Android Chrome 會擋自訂網址，改用 intent:// 指定高德套件，沒裝才退回網頁
    const tail=`#Intent;scheme=%S;package=com.autonavi.minimap;S.browser_fallback_url=${e(web)};end`;
    if(kind==="nav")return `intent://route/plan/?${sa}&dlat=${ll[1]}&dlon=${ll[0]}&dname=${e(name||kw)}&dev=1&t=0`+tail.replace("%S","amapuri");
    if(kind==="near")return `intent://poi?${sa}&keywords=${e(kw)}&lat=${ll[1]}&lon=${ll[0]}&dev=1`+tail.replace("%S","androidamap");
    return `intent://poi?${sa}&keywords=${e(kw)}&dev=0`+tail.replace("%S","androidamap");
  }
  return null;
}
function fallbackBar(web){
  let bar=document.getElementById("fb");
  if(!bar){bar=document.createElement("div");bar.id="fb";bar.className="fb";document.body.appendChild(bar)}
  bar.innerHTML=`沒有跳到高德 App？<a href="${web}" target="_blank" rel="noopener">改開網頁版</a><button type="button" aria-label="關閉">×</button>`;
  bar.querySelector("button").onclick=()=>bar.classList.remove("on");
  bar.classList.add("on");clearTimeout(fallbackBar._t);fallbackBar._t=setTimeout(()=>bar.classList.remove("on"),8000);
}
function openAmap(a){
  const {kind,kw}=a.dataset, ll=a.dataset.ll.split(",").map(Number), web=a.href, app=amapApp(kind,kw,ll,a.dataset.name,web);
  if(!app){window.open(web,"_blank","noopener");return}
  location.href=app;
  // iPhone 會先跳出「要在高德中打開嗎？」，不自動切網頁，只給一個備用按鈕
  setTimeout(()=>{if(!document.hidden)fallbackBar(web)},1200);
}
document.addEventListener("click",ev=>{const a=ev.target.closest("a[data-kind]");if(!a)return;ev.preventDefault();openAmap(a)});

// ---- 狀態（打勾）----
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done=store.get("done")||{};
const todayISO=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai"}).format(new Date());
let cur=Math.max(0,DAYS.findIndex(x=>x.d===todayISO));
const hashIdx=DAYS.findIndex(x=>"d"+x.d.replace(/-/g,"")===location.hash.slice(1));
if(hashIdx>=0)cur=hashIdx; else { const s=store.get("tab"); if(DAYS.findIndex(x=>x.d===todayISO)<0 && Number.isInteger(s)) cur=s; }

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),1800)}

function renderTabs(){
  const nav=document.getElementById("tabs");
  nav.innerHTML=DAYS.map((x,i)=>`<button class="tab" role="tab" id="tab${i}" aria-selected="${i===cur}" data-i="${i}"><b>${x.tab}${x.d===todayISO?'<i class="today">今天</i>':""}</b><span>${esc(x.city)}${x.cw?'<i class="cw">🚶</i>':""}</span></button>`).join("");
  nav.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;store.set("tab",cur);render();window.scrollTo({top:0})});
  const sel=nav.querySelector('[aria-selected="true"]');if(sel)sel.scrollIntoView({inline:"center",block:"nearest"});
}

function stopCard(it,dayKey,idx){
  const key=dayKey+":"+idx, isDone=!!done[key];
  const sid=it.n?` id="stop-${it.n}"`:"";
  const start=idx===0; // 每天的起點（出發的飯店／抵達的機場）不需要叫車、路線
  const badge=it.b?`<div class="num b" aria-hidden="true">${it.b}</div>`:it.h?'<div class="num h" aria-hidden="true">宿</div>':it.f?'<div class="num f" aria-hidden="true">✈</div>':`<button type="button" class="num${it.food?" food":""}" data-done aria-pressed="${isDone}" aria-label="第 ${it.n} 站，點一下標記已去過">${it.n}</button>`;
  const addr=it.addr?`<div class="addr">${esc(it.addr)}</div>`:"";
  return `<li class="stop${isDone?" done":""}"${sid} data-key="${key}">
    ${badge}
    <div class="title"><div class="t">${esc(it.t||"")}</div>
      <div class="nrow"><h3>${esc(it.name)}</h3>
        <div class="acts">
          ${start?"":`<a class="act main" href="${it.near?amapNear(it.kw,it.ll):amapSearch(it.kw,it.c)}" data-kind="${it.near?"near":"search"}" data-kw="${esc(it.kw)}" data-ll="${it.ll}" target="_blank" rel="noopener">高德叫車</a>
<a class="act" href="${amapNav(it)}" data-kind="nav" data-kw="${esc(it.kw)}" data-name="${esc(it.kw)}" data-ll="${it.ll}" target="_blank" rel="noopener">路線</a>`}
          <button class="act" type="button" data-near aria-expanded="false">周邊</button>
        </div></div>
      ${it.d?`<p>${esc(it.d)}</p>`:""}${addr}</div>
    <div class="near" hidden>
      ${NEAR.map(k=>`<a class="chip" href="${amapNear(k,it.ll)}" data-kind="near" data-kw="${k}" data-ll="${it.ll}" target="_blank" rel="noopener">${k}</a>`).join("")}
      <button class="chip" type="button" data-copy="${esc(it.addr||it.kw)}">複製店名／地址</button>
    </div>
  </li>`;
}

function render(){
  renderTabs();
  const day=DAYS[cur], main=document.getElementById("main");
  history.replaceState(null,"","#d"+day.d.replace(/-/g,""));
  main.innerHTML=`<div class="dayhead"><div class="meta">${esc(day.meta)}</div><h2>${esc(day.title)}${day.cw?'<span class="cwb">🚶 City Walk</span>':""}</h2><p>${esc(day.note)}</p></div>
  <div class="mapwrap" id="map"></div>
  <div class="maphint"><span><b style="color:var(--food)">●</b> 美食　<b style="color:var(--walk)">┅</b> 步行・點號碼跳到行程</span><button type="button" id="zoom" aria-pressed="false">放大地圖</button></div>
  <ol class="list">${day.items.map((it,i)=>it.leg?`<li class="leg${it.walk?" walk":""}">${it.walk?"🚶 ":""}${esc(it.leg)}</li>`:stopCard(it,day.d,i)).join("")}</ol>
  <div class="info"><h4>怎麼用高德</h4><ul>
    <li>手機要先安裝「高德地圖」App 並登入。按按鈕會直接打開 App；沒裝 App 才會改開網頁版，網頁版不能叫車。</li>
    <li>「高德叫車」：在高德裡搜尋這個地點，點正確的結果，再按「打車」就能叫車。</li>
    <li>「路線」：直接規劃開車路線到這個地點（座標是概略的，要精準請用「高德叫車」）。</li>
    <li>「周邊」：找附近的美食、咖啡、廁所、地鐵站。</li>
    <li>叫車要在大陸境內才叫得到車，先在高德綁好支付寶或微信支付。</li>
  </ul></div>`;
  try{
    const md=MAPDAYS.find(m=>m.id==="d"+cur), box=document.getElementById("map");
    box.appendChild(drawMap(md,n=>{const li=document.getElementById("stop-"+n);if(!li)return;
      li.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});
      li.classList.add("flash");setTimeout(()=>li.classList.remove("flash"),1400)}));
    const zb=document.getElementById("zoom");
    zb.onclick=()=>{const z=box.classList.toggle("zoom");zb.textContent=z?"縮小地圖":"放大地圖";zb.setAttribute("aria-pressed",String(z))};
  }catch(e){const m=document.getElementById("map");if(m)m.hidden=true}
  main.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{const li=b.closest(".stop"),k=li.dataset.key,on=!done[k];if(on)done[k]=1;else delete done[k];store.set("done",done);li.classList.toggle("done",on);b.setAttribute("aria-pressed",String(on));toast(on?"已標記去過":"已取消標記")});
  main.querySelectorAll("[data-near]").forEach(b=>b.onclick=()=>{const n=b.closest(".stop").querySelector(".near");n.hidden=!n.hidden;b.setAttribute("aria-expanded",String(!n.hidden))});
  main.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{const v=b.dataset.copy;
    const fallback=()=>{const r=document.createRange();r.selectNodeContents(b);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("已選取，長按複製")};
    try{navigator.clipboard.writeText(v).then(()=>toast("已複製："+v),fallback)}catch(e){fallback()}});
}
// render() 在地圖腳本載入後執行

// 離線快取（部署到 GitHub Pages 後生效；在預覽環境會自動略過）
if("serviceWorker" in navigator && location.protocol==="https:" && !/claude/.test(location.hostname)){
  try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
}
</script>
<script>render();</script>
